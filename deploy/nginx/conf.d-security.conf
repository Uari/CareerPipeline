# /etc/nginx/conf.d/security.conf  (http context, shared by all sites)
server_tokens off;

# Rate limit zones (keyed by client IP)
limit_req_zone $binary_remote_addr zone=cp_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cp_login:10m  rate=5r/m;
limit_req_status 429;

# Known scanner / exploit tool user agents (empty UA too)
map $http_user_agent $bad_bot {
    default 0;
    ""      1;
    ~*(sqlmap|nikto|nmap|masscan|zgrab|nuclei|dirbuster|gobuster|feroxbuster|wpscan|acunetix|netsparker|censys|expanse|l9explore|httpx|fuzz) 1;
}

# Catch-all: requests by raw IP or unknown Host get dropped
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
