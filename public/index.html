<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Pipeline</title>
  <meta name="description" content="개인 커리어 관리 시스템 - 스킬, 이력서, 목표, 파일" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ── Mobile Header ── -->
<div id="mobile-header">
  <button id="hamburger-btn" onclick="toggleSidebar()" aria-label="메뉴 열기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
  <span class="mobile-logo">CareerPipeline</span>
</div>
<!-- Sidebar Overlay -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ── Sidebar ── -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <h1>CareerPipeline</h1>
    <p>Personal Career PMS</p>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section-label">메뉴</div>
    <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span>대시보드</span>
    </div>
    <div class="nav-item" data-page="skills" onclick="navigate('skills')">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg><span>스킬 관리</span>
    </div>
    <div class="nav-item" data-page="resume" onclick="navigate('resume')">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg><span>이력서</span>
    </div>
    <div class="nav-item" data-page="goals" onclick="navigate('goals')">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>학습 목표</span>
    </div>
    <div class="nav-item" data-page="files" onclick="navigate('files')">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span>파일 관리</span>
    </div>
  </div>
  <div class="sidebar-footer">
    <div class="storage">
      <div class="storage-head">
        <span class="storage-label" id="storage-label">저장공간</span>
        <span id="storage-text">로딩 중...</span>
      </div>
      <div class="storage-bar" title="저장공간">
        <div class="storage-bar-fill" id="storage-bar-fill" style="width:0%"></div>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="openPasswordModal()" title="비밀번호 변경"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg><span>비밀번호 변경</span></button>
    <button class="btn btn-ghost btn-sm" onclick="logout()" title="로그아웃"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>로그아웃</span></button>
  </div>
</nav>

<!-- ── Main ── -->
<main id="main-content">

  <!-- Dashboard -->
  <section id="page-dashboard" class="page">
    <div class="page-header">
      <h2 class="page-title">대시보드</h2>
    </div>
    <div class="stat-grid" id="dash-stats"></div>
    <div class="dash-grid">
      <div class="card">
        <div class="card-head">
          <h3 class="card-title">최근 스킬</h3>
          <button class="link-btn" onclick="navigate('skills')">전체보기<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div id="dash-skills"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h3 class="card-title">진행 중인 목표</h3>
          <button class="link-btn" onclick="navigate('goals')">전체보기<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div id="dash-goals"></div>
      </div>
    </div>
  </section>

  <!-- Skills -->
  <section id="page-skills" class="page hidden">
    <div class="page-header">
      <h2 class="page-title">스킬 관리 <span id="skills-count"></span></h2>
      <button class="btn btn-primary" onclick="openSkillModal()"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>스킬 추가</span></button>
    </div>
    <!-- 카테고리 필터 -->
    <div class="mb-4" id="skill-filters" role="group" aria-label="카테고리 필터">
      <button class="btn btn-secondary btn-sm active-filter" data-cat="all" onclick="filterSkills('all')">전체</button>
      <button class="btn btn-secondary btn-sm" data-cat="lang" onclick="filterSkills('lang')">언어</button>
      <button class="btn btn-secondary btn-sm" data-cat="framework" onclick="filterSkills('framework')">프레임워크</button>
      <button class="btn btn-secondary btn-sm" data-cat="devops" onclick="filterSkills('devops')">DevOps</button>
      <button class="btn btn-secondary btn-sm" data-cat="soft" onclick="filterSkills('soft')">소프트스킬</button>
      <button class="btn btn-secondary btn-sm" data-cat="etc" onclick="filterSkills('etc')">기타</button>
    </div>
    <div class="card-grid" id="skills-list"></div>
  </section>

  <!-- Resume -->
  <section id="page-resume" class="page hidden">
    <div class="page-header">
      <h2 class="page-title">이력서 버전 관리</h2>
      <button class="btn btn-primary" onclick="openResumeModal()"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>새 버전 추가</span></button>
    </div>
    <div id="resume-list" class="flex flex-col gap-3"></div>
  </section>

  <!-- Goals -->
  <section id="page-goals" class="page hidden">
    <div class="page-header">
      <h2 class="page-title">학습 목표</h2>
      <button class="btn btn-primary" onclick="openGoalModal()"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>목표 추가</span></button>
    </div>
    <div class="card-grid" id="goals-list"></div>
  </section>

  <!-- Files -->
  <section id="page-files" class="page hidden">
    <div class="page-header">
      <h2 class="page-title">파일 관리</h2>
    </div>
    <!-- Dropzone -->
    <div class="dropzone mb-4" id="dropzone" onclick="document.getElementById('file-input').click()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <div class="dropzone-icon"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg></div>
      <div class="dropzone-text"><strong>클릭</strong>하거나 파일을 드래그하여 업로드</div>
      <div class="text-sm text-muted mt-2">최대 500MB / 파일 · 전체 형식 허용</div>
      <input type="file" id="file-input" class="hidden" multiple onchange="uploadFiles(this.files)" />
    </div>
    <div class="card table-card">
      <div class="table-wrap">
        <table id="files-table">
          <thead>
            <tr>
              <th>파일명</th>
              <th>크기</th>
              <th>업로드일</th>
              <th>메모</th>
              <th aria-label="작업"></th>
            </tr>
          </thead>
          <tbody id="files-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<!-- ── Modals ── -->

<!-- Skill Modal -->
<div class="modal-backdrop" id="modal-skill">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="skill-modal-title">스킬 추가</div>
      <button class="modal-close" onclick="closeModal('modal-skill')" aria-label="닫기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="form-group">
      <label class="form-label">스킬명 *</label>
      <input class="form-input" id="skill-name" placeholder="예: TypeScript" />
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select class="form-select" id="skill-category">
          <option value="lang">언어</option>
          <option value="framework">프레임워크</option>
          <option value="devops">DevOps</option>
          <option value="soft">소프트스킬</option>
          <option value="etc">기타</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">레벨 (1~5)</label>
        <select class="form-select" id="skill-level">
          <option value="1">1 · 입문</option>
          <option value="2">2 · 초급</option>
          <option value="3">3 · 중급</option>
          <option value="4">4 · 고급</option>
          <option value="5">5 · 전문가</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">메모</label>
      <textarea class="form-textarea" id="skill-note" placeholder="스킬에 대한 메모..." style="min-height:70px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-skill')">취소</button>
      <button class="btn btn-primary" onclick="saveSkill()">저장</button>
    </div>
  </div>
</div>

<!-- Skill History Modal -->
<div class="modal-backdrop" id="modal-skill-history">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">레벨 성장 이력</div>
      <button class="modal-close" onclick="closeModal('modal-skill-history')" aria-label="닫기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="skill-history-content"></div>
  </div>
</div>

<!-- Resume Modal -->
<div class="modal-backdrop" id="modal-resume">
  <div class="modal" style="width:640px;">
    <div class="modal-header">
      <div class="modal-title" id="resume-modal-title">이력서 추가</div>
      <button class="modal-close" onclick="closeModal('modal-resume')" aria-label="닫기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">제목 *</label>
        <input class="form-input" id="resume-title" placeholder="예: 백엔드 개발자용" />
      </div>
      <div class="form-group">
        <label class="form-label">버전</label>
        <input class="form-input" id="resume-version" placeholder="예: 2.1" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">태그 (쉼표 구분)</label>
      <input class="form-input" id="resume-tags" placeholder="예: 백엔드, 포트폴리오, 2026" />
    </div>
    <div class="form-group">
      <label class="form-label">내용</label>
      <textarea class="form-textarea resume-content-editor" id="resume-content" placeholder="이력서 내용을 작성하세요..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-resume')">취소</button>
      <button class="btn btn-primary" onclick="saveResume()">저장</button>
    </div>
  </div>
</div>

<!-- Goal Modal -->
<div class="modal-backdrop" id="modal-goal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="goal-modal-title">목표 추가</div>
      <button class="modal-close" onclick="closeModal('modal-goal')" aria-label="닫기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="form-group">
      <label class="form-label">목표 제목 *</label>
      <input class="form-input" id="goal-title" placeholder="예: AWS Solutions Architect 취득" />
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">유형</label>
        <select class="form-select" id="goal-type">
          <option value="monthly">월간</option>
          <option value="quarterly">분기</option>
          <option value="annual">연간</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">기간</label>
        <input class="form-input" id="goal-period" placeholder="예: 2026-Q2" />
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">목표 달성일</label>
        <input type="date" class="form-input" id="goal-target-date" />
      </div>
      <div class="form-group">
        <label class="form-label">진행률 (%)</label>
        <input type="number" class="form-input" id="goal-progress" min="0" max="100" value="0" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">설명</label>
      <textarea class="form-textarea" id="goal-description" placeholder="목표에 대한 상세 설명..." style="min-height:70px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-goal')">취소</button>
      <button class="btn btn-primary" onclick="saveGoal()">저장</button>
    </div>
  </div>
</div>

<!-- Learning Log Modal -->
<div class="modal-backdrop" id="modal-log">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">학습 로그 추가</div>
      <button class="modal-close" onclick="closeModal('modal-log')" aria-label="닫기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <input type="hidden" id="log-goal-id" />
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">날짜</label>
        <input type="date" class="form-input" id="log-date" />
      </div>
      <div class="form-group">
        <label class="form-label">학습 시간 (분)</label>
        <input type="number" class="form-input" id="log-duration" min="0" placeholder="60" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">학습 내용 *</label>
      <textarea class="form-textarea" id="log-content" placeholder="오늘 학습한 내용을 기록하세요..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-log')">취소</button>
      <button class="btn btn-primary" onclick="saveLog()">저장</button>
    </div>
  </div>
</div>

<!-- Goal Detail Modal -->
<div class="modal-backdrop" id="modal-goal-detail">
  <div class="modal" style="width:600px;">
    <div class="modal-header">
      <div class="modal-title" id="goal-detail-title"></div>
      <button class="modal-close" onclick="closeModal('modal-goal-detail')" aria-label="닫기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="goal-detail-logs"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="openLogModal(currentGoalId)"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>로그 추가</span></button>
      <button class="btn btn-secondary" onclick="closeModal('modal-goal-detail')">닫기</button>
    </div>
  </div>
</div>

<!-- Password Modal -->
<div class="modal-backdrop" id="modal-password">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">비밀번호 변경</div>
      <button class="modal-close" onclick="closeModal('modal-password')" aria-label="닫기"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="form-group">
      <label class="form-label" for="pw-current">현재 비밀번호</label>
      <input type="password" class="form-input" id="pw-current" autocomplete="current-password" />
    </div>
    <div class="form-group">
      <label class="form-label" for="pw-new">새 비밀번호</label>
      <input type="password" class="form-input" id="pw-new" autocomplete="new-password" placeholder="8자 이상" />
    </div>
    <div class="form-group">
      <label class="form-label" for="pw-confirm">새 비밀번호 확인</label>
      <input type="password" class="form-input" id="pw-confirm" autocomplete="new-password" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-password')">취소</button>
      <button class="btn btn-primary" onclick="changePassword()">변경</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script src="/app.js"></script>
</body>
</html>
