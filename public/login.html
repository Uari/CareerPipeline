<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>로그인 - Career Pipeline</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="auth">
  <main class="auth-wrap">
    <div class="auth-brand">CareerPipeline</div>
    <form id="login-form" class="card auth-card">
      <h1 class="auth-title">로그인</h1>
      <p class="auth-sub">계정 정보를 입력해 계속하세요.</p>
      <div class="form-group">
        <label class="form-label" for="username">아이디</label>
        <input class="form-input" id="username" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div id="login-error" class="auth-error" role="alert"></div>
      <button class="btn btn-primary w-full" type="submit">로그인</button>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('login-error');
      err.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: e.target.username.value, password: e.target.password.value }),
        });
        if (r.ok) return location.href = '/';
        err.textContent = (await r.json().catch(() => ({}))).error || '로그인 실패';
      } catch { err.textContent = '서버에 연결할 수 없습니다.'; }
    });
  </script>
</body>
</html>
