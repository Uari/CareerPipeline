<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>로그인 - Career Pipeline</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body style="align-items:center;justify-content:center;">
  <form id="login-form" class="card" style="width:340px;max-width:calc(100vw - 32px);">
    <h1 style="font-size:18px;margin-bottom:20px;">⚡ CareerPipeline</h1>
    <div class="form-group">
      <label class="form-label" for="username">아이디</label>
      <input class="form-input" id="username" name="username" autocomplete="username" required autofocus />
    </div>
    <div class="form-group">
      <label class="form-label" for="password">비밀번호</label>
      <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <div id="login-error" class="text-sm mb-4" style="color:var(--accent-danger);min-height:18px;" role="alert"></div>
    <button class="btn btn-primary w-full" type="submit" style="justify-content:center;">로그인</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('login-error');
      err.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: e.target.username.value, password: e.target.password.value }),
        });
        if (r.ok) return location.href = '/';
        err.textContent = (await r.json().catch(() => ({}))).error || '로그인 실패';
      } catch { err.textContent = '서버에 연결할 수 없습니다.'; }
    });
  </script>
</body>
</html>
